name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        go:
          - "1.24.x"
          - "1.25.x"
          - "1.26.x"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify module files
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Test with the race detector
        if: matrix.os != 'windows-latest'
        shell: bash
        run: go test -race ./...

      - name: Test
        if: matrix.os == 'windows-latest'
        shell: bash
        run: go test ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  tidy:
    name: Module tidiness
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Check go.mod and go.sum
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Measure coverage
        shell: bash
        run: |
          set -euo pipefail
          go test -covermode=atomic -coverprofile=coverage.out .
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          echo "Total coverage: ${total}%"
          awk -v total="$total" 'BEGIN { if (total < 70) { printf "coverage %.2f%% is below the 70%% gate\n", total; exit 1 } }'

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: coverage.out
          if-no-files-found: error

  interop:
    name: Openpyxl interoperability
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Install openpyxl
        run: python3 -m pip install --user --disable-pip-version-check openpyxl

      - name: Generate conformance workbooks
        run: |
          go run ./internal/testgen -out "$RUNNER_TEMP/conformance.xlsx"
          go run ./internal/testgen -out "$RUNNER_TEMP/conformance-stream.xlsx" -stream

      - name: Read both workbooks with openpyxl
        run: |
          python3 scripts/check_openpyxl.py "$RUNNER_TEMP/conformance.xlsx"
          python3 scripts/check_openpyxl.py "$RUNNER_TEMP/conformance-stream.xlsx"

  fuzz:
    name: Fuzz smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Fuzz the reader
        run: go test -run '^$' -fuzz=FuzzReader -fuzztime=15s .

      - name: Fuzz column conversion
        run: go test -run '^$' -fuzz=FuzzNumericToLetters -fuzztime=10s .

  gosec:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Run gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet ./...

  examples:
    name: Examples smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Run the examples
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/xlsx-examples"
          mkdir -p "$out"
          go run ./examples/basic -out "$out/basic.xlsx"
          go run ./examples/read -in "$out/basic.xlsx" -max-rows 3
          go run ./examples/complex -out "$out/complex.xlsx" -rows 2000

      - name: Smoke test the HTTP example
        shell: bash
        run: |
          set -euo pipefail
          go run ./examples/http -addr 127.0.0.1:18080 -rows 100 >"$RUNNER_TEMP/http.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS -o "$RUNNER_TEMP/buffered.xlsx" http://127.0.0.1:18080/buffered.xlsx
          curl -fsS -o "$RUNNER_TEMP/streamed.xlsx" http://127.0.0.1:18080/streamed.xlsx
          unzip -t "$RUNNER_TEMP/buffered.xlsx" >/dev/null
          unzip -t "$RUNNER_TEMP/streamed.xlsx" >/dev/null

  benchmarks:
    name: Benchmark smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Make sure the benchmarks still compile and run
        run: go test -run '^$' -bench . -benchtime=1x -count=1 ./...

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
